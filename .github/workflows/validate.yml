name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  blueprints-in-sync:
    name: Bundled blueprints match blueprints/automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare copies
        run: |
          status=0
          for f in custom_components/appliance_live_activity/blueprints/*.yaml; do
            src="blueprints/automation/$(basename "$f")"
            if ! cmp -s "$f" "$src"; then
              echo "::error file=$f::Out of sync with $src — run scripts/sync_blueprints.sh"
              status=1
            fi
          done
          exit $status

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: pytest -q tests
